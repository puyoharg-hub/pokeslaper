<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パーティをつくる</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="party-stage">

    <div class="party-grid-area" id="partyGridArea">
      <div class="slot-grid" id="slotGrid"></div>

      <svg class="crop-marks" width="100%" height="100%" viewBox="0 0 1280 559" preserveAspectRatio="none">
        <line x1="426.67" y1="0" x2="426.67" y2="80" />
        <line x1="853.33" y1="0" x2="853.33" y2="80" />
        <line x1="426.67" y1="559" x2="426.67" y2="479" />
        <line x1="853.33" y1="559" x2="853.33" y2="479" />
        <line x1="0" y1="279.5" x2="120" y2="279.5" />
        <line x1="1280" y1="279.5" x2="1160" y2="279.5" />
        <line x1="336.67" y1="279.5" x2="516.67" y2="279.5" />
        <line x1="426.67" y1="219.5" x2="426.67" y2="339.5" />
        <line x1="763.33" y1="279.5" x2="943.33" y2="279.5" />
        <line x1="853.33" y1="219.5" x2="853.33" y2="339.5" />
        </line>
      </svg>
    </div>

    <div class="party-side-panel" id="partySidePanel">
      <button class="side-btn" id="presetSwitchBtn" data-preset="1">プリセット 1</button>
      <button class="side-btn" id="saveBtn">保存</button>
      <button class="side-btn" id="loadBtn">呼び出し</button>
      <button class="side-btn" id="clearBtn">クリア</button>
      <button class="side-btn" id="settingsBtn">設定</button>
    </div>

  </div>

  <div class="modal-overlay" id="editModal">
    <div class="edit-modal" id="editModalBox">
      <div class="modal-body">
        <div class="modal-grid">

          <div class="area-a field-box compact-field">
            <div class="field-label">ポケモン名</div>
            <button class="name-picker-btn" id="namePickerBtn">
              <div class="np-sprite" id="npSprite"></div>
              <div>
                <div class="np-name placeholder" id="npName"></div>
                <div class="np-type-pills" id="npTypes"></div>
              </div>
            </button>
          </div>

          <div class="area-b field-box compact-field">
            <div class="field-label">特性</div>
            <div class="ability-combo" id="abilityCombo">
              <input class="auto-input" id="abilityInput" readonly autocomplete="off" disabled>
              <div class="ability-panel" id="abilityPanel"></div>
            </div>
          </div>

          <div class="area-c field-box compact-field">
            <div class="field-label">道具</div>
            <button class="item-picker-btn" id="itemPickerBtn">
              <div class="ip-icon" id="ipIcon"></div>
              <div class="ip-name placeholder" id="ipName"></div>
            </button>
          </div>

          <div class="area-d field-box">
            <div class="stat-block-header">
              <span class="stat-block-title">能力値<span class="stat-block-desc">※各種ステータスを左クリックで上昇補正／右クリックで下降補正<br>※能力Pの枠内をダブルクリックで極振り</span>
            </div>
            <table class="stat-edit-table">
              <thead>
                <tr>
                  <th>ステータス</th>
                  <th>種族値</th>
                  <th>実数値</th>
                  <th>能力P</th>
                  <th><span class="ev-summary" id="evSummary">能力P残り：<b id="evRemain"></b><br>能力P合計：<b
                        id="evTotal"></b></span></th>
                </tr>
              </thead>
              <tbody id="statTableBody"></tbody>
            </table>
          </div>

          <div class="area-f1 field-box compact-field">
            <button class="move-picker-btn" data-move-idx="0">
              <img class="mp-type-icon" id="mpIcon0" style="display:none;">
              <span class="mp-name placeholder" id="mpName0"></span>
            </button>
          </div>
          <div class="area-f2 field-box compact-field">
            <button class="move-picker-btn" data-move-idx="1">
              <img class="mp-type-icon" id="mpIcon1" style="display:none;">
              <span class="mp-name placeholder" id="mpName1"></span>
            </button>
          </div>
          <div class="area-f3 field-box compact-field">
            <button class="move-picker-btn" data-move-idx="2">
              <img class="mp-type-icon" id="mpIcon2" style="display:none;">
              <span class="mp-name placeholder" id="mpName2"></span>
            </button>
          </div>
          <div class="area-f4 field-box compact-field">
            <button class="move-picker-btn" data-move-idx="3">
              <img class="mp-type-icon" id="mpIcon3" style="display:none;">
              <span class="mp-name placeholder" id="mpName3"></span>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="sub-overlay" id="pokemonOverlay">
    <div class="sub-panel">
      <div class="sub-panel-header">
        <input type="text" class="sub-search-input" id="pokemonSearchInput" placeholder="ポケモン名で絞り込み...">

      </div>
      <div class="sub-grid" id="pokemonGrid"></div>
    </div>
  </div>

  <div class="sub-overlay" id="itemOverlay">
    <div class="sub-panel">
      <div class="sub-panel-header">
        <input type="text" class="sub-search-input" id="itemSearchInput" placeholder="道具名で絞り込み...">

      </div>
      <div class="sub-grid" id="itemGrid"></div>
    </div>
  </div>

  <div class="sub-overlay" id="moveOverlay">
    <div class="sub-panel">
      <div class="sub-panel-header">
        <input type="text" class="sub-search-input" id="moveSearchInput" placeholder="技名で絞り込み...">

      </div>
      <div class="sub-grid" id="moveGrid"></div>
    </div>
  </div>

  <div class="sub-overlay" id="loadOverlay">
    <div class="sub-panel">
      <div class="sub-panel-header">
        <button class="sub-panel-clear" id="savedPartyClearBtn">クリア</button>
      </div>
      <div class="sub-grid" id="savedPartyGrid"></div>
    </div>
  </div>

  <script src="item.js"></script>
  <script src="champions-data.js"></script>

  <script src="party-data.js"></script>
  <script src="party-stats.js"></script>
  <script src="party-ui.js"></script>

</body>

</html>
