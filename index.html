<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パーティ編成</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="party-stage">

    <div class="party-grid-area" id="partyGridArea">
      <div class="slot-grid" id="slotGrid"></div>

      <svg class="crop-marks" width="100%" height="100%" viewBox="0 0 1280 559" preserveAspectRatio="none">
        <line x1="426.67" y1="0" x2="426.67" y2="80" />
        <line x1="853.33" y1="0" x2="853.33" y2="80" />
        <line x1="426.67" y1="559" x2="426.67" y2="479" />
        <line x1="853.33" y1="559" x2="853.33" y2="479" />
        <line x1="0" y1="279.5" x2="120" y2="279.5" />
        <line x1="1280" y1="279.5" x2="1160" y2="279.5" />
        <line x1="336.67" y1="279.5" x2="516.67" y2="279.5" />
        <line x1="426.67" y1="219.5" x2="426.67" y2="339.5" />
        <line x1="763.33" y1="279.5" x2="943.33" y2="279.5" />
        <line x1="853.33" y1="219.5" x2="853.33" y2="339.5" />
        </line>
      </svg>
    </div>

    <div class="party-side-panel" id="partySidePanel"></div>

  </div>

  <div class="modal-overlay" id="editModal">
    <div class="edit-modal" id="editModalBox">
      <div class="modal-body">
        <div class="modal-grid">

          <div class="area-a field-box">
            <div class="field-label">ポケモン名</div>
            <button class="name-picker-btn" id="namePickerBtn">
              <div class="np-sprite" id="npSprite">?</div>
              <div>
                <div class="np-name placeholder" id="npName">タップして選択</div>
                <div class="np-types" id="npTypes"></div>
              </div>
            </button>
          </div>

          <div class="area-b field-box">
            <div class="field-label">特性</div>
            <input class="auto-input" id="abilityInput" list="abilityList" placeholder="特性を入力...">
            <datalist id="abilityList"></datalist>
            <div class="field-hint" id="abilityHint">ポケモンを選択すると候補が絞り込まれます</div>
          </div>

          <div class="area-c field-box">
            <div class="field-label">道具</div>
            <button class="item-picker-btn" id="itemPickerBtn">
              <div class="ip-icon" id="ipIcon">－</div>
              <div class="ip-name placeholder" id="ipName">タップして選択</div>
            </button>
          </div>

          <div class="area-d field-box">
            <div class="stat-block-header">
              <span class="stat-block-title">能力値<span class="stat-block-desc">（各種ステータスを左クリックで上昇補正／右クリックで下降補正）</span>
            </div>
            <table class="stat-edit-table">
              <thead>
                <tr>
                  <th>ステータス</th>
                  <th>種族値</th>
                  <th>実数値</th>
                  <th>能力P</th>
                  <th><span class="ev-summary" id="evSummary">能力P残り：<b id="evRemain">66</b><br>能力P合計：<b
                        id="evTotal">0</b></span></th>
                </tr>
              </thead>
              <tbody id="statTableBody"></tbody>
            </table>
          </div>

          <div class="area-f1 field-box">
            <div class="field-label">技1</div>
            <button class="move-picker-btn" data-move-idx="0">
              <span class="mp-name placeholder" id="mpName0">タップして選択</span>
            </button>
          </div>
          <div class="area-f2 field-box">
            <div class="field-label">技2</div>
            <button class="move-picker-btn" data-move-idx="1">
              <span class="mp-name placeholder" id="mpName1">タップして選択</span>
            </button>
          </div>
          <div class="area-f3 field-box">
            <div class="field-label">技3</div>
            <button class="move-picker-btn" data-move-idx="2">
              <span class="mp-name placeholder" id="mpName2">タップして選択</span>
            </button>
          </div>
          <div class="area-f4 field-box">
            <div class="field-label">技4</div>
            <button class="move-picker-btn" data-move-idx="3">
              <span class="mp-name placeholder" id="mpName3">タップして選択</span>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="sub-overlay" id="pokemonOverlay">
    <div class="sub-panel">
      <div class="sub-panel-header">
        <span class="sub-panel-title">ポケモン</span>
        <input type="text" class="sub-search-input" id="pokemonSearchInput" placeholder="ポケモン名で絞り込み...">
        <button class="sub-panel-close" id="pokemonOverlayClose">&times;</button>
      </div>
      <div class="sub-grid" id="pokemonGrid"></div>
    </div>
  </div>

  <div class="sub-overlay" id="itemOverlay">
    <div class="sub-panel">
      <div class="sub-panel-header">
        <span class="sub-panel-title">道具</span>
        <input type="text" class="sub-search-input" id="itemSearchInput" placeholder="道具名で絞り込み...">
        <button class="sub-panel-close" id="itemOverlayClose">&times;</button>
      </div>
      <div class="sub-grid" id="itemGrid"></div>
    </div>
  </div>

  <div class="sub-overlay" id="moveOverlay">
    <div class="sub-panel">
      <div class="sub-panel-header">
        <span class="sub-panel-title">技</span>
        <input type="text" class="sub-search-input" id="moveSearchInput" placeholder="技名で絞り込み...">
        <button class="sub-panel-close" id="moveOverlayClose">&times;</button>
      </div>
      <div class="sub-grid" id="moveGrid"></div>
    </div>
  </div>

  <script src="typechart.js"></script>
  <script src="data.js"></script>
  <script src="champions_move_ability_data.js"></script>

  <script src="party-data.js"></script>
  <script src="party-stats.js"></script>
  <script src="party-ui.js"></script>

</body>

</html>
